<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{META_DESC}}">
<meta property="og:title" content="{{OG_TITLE}}">
<meta property="og:description" content="{{OG_DESC}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;color:#0f172a;background:#fff;line-height:1.5;-webkit-font-smoothing:antialiased}
  .hero{padding:80px 24px;text-align:center;max-width:920px;margin:0 auto}
  .hero h1{font-size:clamp(32px,5vw,56px);letter-spacing:-0.02em;margin:12px 0 16px}
  .hero h1 em{font-style:normal;background:linear-gradient(135deg,#0091CE,#1F1B4D);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero-sub{font-size:18px;color:#475569;max-width:60ch;margin:0 auto 28px}
  .hero-cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:12px 22px;border-radius:8px;font-weight:600;text-decoration:none;font-size:15px;transition:transform .15s}
  .btn-blue{background:#0091CE;color:#fff}
  .btn-ghost{background:#fff;color:#0f172a;border:1px solid #cbd5e1}
  .btn:hover{transform:translateY(-1px)}
  .trust-row{list-style:none;display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:28px;color:#64748b;font-size:13px}
  .el{display:inline-block;padding:4px 10px;background:#E6F4FB;color:#0079AB;border-radius:9999px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
  section{padding:40px 24px;max-width:1100px;margin:0 auto}
</style>
{{CONFIG_OVERRIDES}}
</head>
<body>
